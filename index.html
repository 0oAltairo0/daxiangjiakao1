<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#268FF7">
<title>驾考做题器</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app" class="app">

  <!-- 首页 -->
  <section id="home" class="screen home">
    <header class="home-header">
      <div class="home-header-inner">
        <div class="home-topline">
          <div>
            <div class="home-title">驾考做题器</div>
            <div class="home-sub">离线题库 · <span id="homeTotal">0</span> 题</div>
          </div>
          <div class="home-actions">
            <select id="licenseSelect" class="license-select" aria-label="选择题库"></select>
            <button class="home-gear" data-action="openSettings" aria-label="设置">
            <svg viewBox="0 0 24 24"><path d="M12 15.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4z" stroke="currentColor" stroke-width="1.9" fill="none"/><path d="M19.4 13.4a7.6 7.6 0 0 0 0-2.8l2-1.5-2-3.4-2.3 1a7.6 7.6 0 0 0-2.5-1.4L14.3 3h-3.9l-.4 2.3a7.6 7.6 0 0 0-2.5 1.4l-2.3-1-2 3.4 2 1.5a7.6 7.6 0 0 0 0 2.8l-2 1.5 2 3.4 2.3-1a7.6 7.6 0 0 0 2.5 1.4l.4 2.3h3.9l.4-2.3a7.6 7.6 0 0 0 2.5-1.4l2.3 1 2-3.4z" stroke="currentColor" stroke-width="1.7" fill="none" stroke-linejoin="round"/></svg>
          </button>
          </div>
        </div>
      </div>
      <nav class="subject-tabs" id="subjectTabs">
        <button class="subject-tab active" data-exam="1">科目一</button>
        <button class="subject-tab" data-exam="4">科目四</button>
      </nav>
      <button class="search-pill" data-action="openSearch">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2" fill="none"/><path d="m16.2 16.2 4.3 4.3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <span>搜索题目、答案、解析、技巧</span>
      </button>
    </header>

    <main class="home-body">
      <div class="stat-card">
        <div class="stat"><b id="statDone">0</b><span>已答</span></div>
        <div class="stat"><b id="statRate">0%</b><span>正确率</span></div>
        <div class="stat"><b id="statWrong">0</b><span>错题</span></div>
        <div class="stat"><b id="statCollect">0</b><span>收藏</span></div>
      </div>

      <div class="mode-list">
        <button class="mode-row" data-mode="seq">
          <span class="mode-icon icon-blue">
            <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          </span>
          <span class="mode-text">
            <b>顺序练习</b>
            <small id="seqHint">从第一题开始</small>
          </span>
          <span class="chevron">›</span>
        </button>

        <button class="mode-row" data-mode="random">
          <span class="mode-icon icon-purple">
            <svg viewBox="0 0 24 24"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
          </span>
          <span class="mode-text">
            <b>随机练习</b>
            <small>打乱顺序，随机抽题</small>
          </span>
          <span class="chevron">›</span>
        </button>

        <button class="mode-row" data-mode="picked">
          <span class="mode-icon icon-teal">
            <svg viewBox="0 0 24 24"><path d="M9 4.5h6a2 2 0 0 1 2 2v.5h1.5A1.5 1.5 0 0 1 20 8.5v11A1.5 1.5 0 0 1 18.5 21h-13A1.5 1.5 0 0 1 4 19.5v-11A1.5 1.5 0 0 1 5.5 7H7v-.5a2 2 0 0 1 2-2z" stroke="currentColor" stroke-width="2" fill="none" stroke-linejoin="round"/><path d="m8.5 13.5 2.2 2.2 4.8-4.8" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </span>
          <span class="mode-text">
            <b>选定内容练习</b>
            <small>自选章节与题目，随机抽练</small>
          </span>
          <span class="chevron">›</span>
        </button>

        <button class="mode-row" data-mode="history">
          <span class="mode-icon icon-slate">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5" stroke="currentColor" stroke-width="2" fill="none"/><path d="M12 7.5V12l3 2" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </span>
          <span class="mode-text">
            <b>选定内容练习历史</b>
            <small id="historyHint">暂无练习记录</small>
          </span>
          <span class="chevron">›</span>
        </button>

        <button class="mode-row" data-mode="chapter">
          <span class="mode-icon icon-green">
            <svg viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v16H6.5A2.5 2.5 0 0 0 4 21.5zM4 18.5V5.5M8 7h8M8 11h6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </span>
          <span class="mode-text">
            <b>章节练习</b>
            <small id="chapterHint">按章节专项突破</small>
          </span>
          <span class="chevron">›</span>
        </button>

        <button class="mode-row" data-mode="wrong">
          <span class="mode-icon icon-red">
            <svg viewBox="0 0 24 24"><path d="M12 8v5M12 16.5v.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M10.3 3.9 2.6 17.2A2 2 0 0 0 4.3 20h15.4a2 2 0 0 0 1.7-2.8L13.7 3.9a2 2 0 0 0-3.4 0z" stroke="currentColor" stroke-width="2" fill="none" stroke-linejoin="round"/></svg>
          </span>
          <span class="mode-text">
            <b>错题练习</b>
            <small id="wrongHint">暂无错题</small>
          </span>
          <span class="chevron">›</span>
        </button>

        <button class="mode-row" data-mode="collect">
          <span class="mode-icon icon-orange">
            <svg viewBox="0 0 24 24"><path d="m12 3.6 2.6 5.3 5.8.8-4.2 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8L3.6 9.7l5.8-.8z" stroke="currentColor" stroke-width="2" fill="none" stroke-linejoin="round"/></svg>
          </span>
          <span class="mode-text">
            <b>收藏练习</b>
            <small id="collectHint">暂无收藏</small>
          </span>
          <span class="chevron">›</span>
        </button>

        <button class="mode-row" data-mode="light" id="lightModeRow">
          <span class="mode-icon icon-cyan">
            <svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5.9 1.2.9 2V16h5.2v-.1c0-.8.3-1.5.9-2A6 6 0 0 0 12 3z" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </span>
          <span class="mode-text">
            <b>灯光模拟考试</b>
            <small id="lightHint">39 题</small>
          </span>
          <span class="chevron">›</span>
        </button>
      </div>

      <div class="home-foot">Powered by Altair</div>
    </main>
  </section>

  <!-- 章节列表 -->
  <section id="chapters" class="screen chapters" hidden>
    <header class="nav">
      <button class="nav-back" data-action="home" aria-label="返回">
        <svg viewBox="0 0 24 24"><path d="M15 4 7 12l8 8" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="nav-title">章节练习</div>
      <div class="nav-right"></div>
    </header>
    <main class="chapter-body" id="chapterList"></main>
  </section>

  <!-- 选定内容练习 -->
  <section id="picker" class="screen picker" hidden>
    <header class="nav">
      <button class="nav-back" data-action="closePicker" aria-label="返回">
        <svg viewBox="0 0 24 24"><path d="M15 4 7 12l8 8" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="nav-title">选定内容练习</div>
      <button class="nav-right text-btn" data-action="pickerReset">清空</button>
    </header>
    <main class="picker-body">
      <div class="picker-section">
        <div class="picker-head">
          <b>一、选择章节</b>
          <span id="pickerChapterHint">可多选</span>
        </div>
        <div class="picker-chapters" id="pickerChapters"></div>
      </div>

      <div class="picker-section" id="pickerQBlock" hidden>
        <div class="picker-head">
          <b>二、勾选题目</b>
          <span id="pickerQHint">不勾选则练习整章</span>
        </div>
        <div class="picker-tools">
          <input id="pickerFilter" class="filter-input" type="text" placeholder="输入关键词筛选题目">
          <button class="mini-btn" data-action="pickerAll">全选</button>
          <button class="mini-btn" data-action="pickerNone">清空</button>
        </div>
        <div class="picker-questions" id="pickerQuestions"></div>
        <button class="more-btn" id="pickerMore" data-action="pickerMore" hidden>加载更多</button>
      </div>
    </main>
    <footer class="picker-foot">
      <div class="picker-summary" id="pickerSummary">请先选择章节</div>
      <div class="picker-foot-row">
        <div class="count-box">
          <button class="count-btn" data-action="pickerCountMinus" aria-label="减少题数">−</button>
          <input id="pickerCount" class="count-input" type="number" inputmode="numeric" min="1" value="0" aria-label="练习题数">
          <button class="count-btn" data-action="pickerCountPlus" aria-label="增加题数">＋</button>
        </div>
        <button class="bar-btn primary" id="pickerStart" data-action="pickerStart">随机开始</button>
      </div>
    </footer>
  </section>

  <!-- 选定内容练习历史 -->
  <section id="history" class="screen history-page" hidden>
    <header class="nav">
      <button class="nav-back" data-action="closeHistory" aria-label="返回">
        <svg viewBox="0 0 24 24"><path d="M15 4 7 12l8 8" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="nav-title">选定内容练习历史</div>
      <div class="nav-right"></div>
    </header>
    <main class="history-body" id="historyBody">
      <div class="history-list" id="historyList"></div>
      <div class="hist-empty" id="historyEmpty" hidden>还没有生成过题目库，先去「选定内容练习」抽题吧</div>
    </main>
    <div class="history-bar" id="historyBar" hidden>
      <button class="bar-btn danger" data-action="historyDelete">删除选中记录</button>
    </div>
  </section>

  <!-- 题库搜索 -->
  <section id="search" class="screen search-page" hidden>
    <header class="search-head">
      <button class="nav-back" data-action="closeSearch" aria-label="返回">
        <svg viewBox="0 0 24 24"><path d="M15 4 7 12l8 8" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="search-box">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2" fill="none"/><path d="m16.2 16.2 4.3 4.3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <input id="searchInput" type="search" placeholder="输入关键词搜索" autocomplete="off">
        <button class="search-clear" id="searchClear" data-action="searchClear" aria-label="清空">✕</button>
      </div>
      <button class="search-go" data-action="doSearch">搜索</button>
    </header>

    <div class="search-filters">
      <div class="filter-group">
        <span class="filter-label">类型</span>
        <div class="chip-row" id="typeChips">
          <button class="chip active" data-qtype="0">全部</button>
          <button class="chip" data-qtype="2">单选</button>
          <button class="chip" data-qtype="3">多选</button>
          <button class="chip" data-qtype="1">判断</button>
        </div>
      </div>
      <div class="filter-group">
        <span class="filter-label">范围</span>
        <div class="chip-row" id="scopeChips">
          <button class="chip active" data-scope="all">全部</button>
          <button class="chip" data-scope="q">题目</button>
          <button class="chip" data-scope="a">答案</button>
          <button class="chip" data-scope="e">试题解析</button>
          <button class="chip" data-scope="k">答题技巧</button>
          <button class="chip" data-scope="c">章节</button>
        </div>
      </div>
    </div>

    <main class="search-body">
      <div class="search-meta" id="searchMeta"></div>
      <div class="search-results" id="searchResults"></div>
      <button class="more-btn" id="searchMore" data-action="searchMore" hidden>加载更多</button>
      <button class="more-btn" id="searchRest" data-action="searchLoadRest" hidden>加载剩余结果</button>
      <div class="scroll-pad"></div>
    </main>

    <div class="select-bar" id="selectBar" hidden>
      <button class="sel-btn" data-action="searchSelectAll">全选</button>
      <button class="sel-btn primary" data-action="searchCollectSel">收藏已选中</button>
      <button class="sel-btn" data-action="searchClearSel">取消选择</button>
    </div>
  </section>

  <!-- 设置 -->
  <section id="settings" class="screen settings" hidden>
    <header class="nav">
      <button class="nav-back" data-action="closeSettings" aria-label="返回">
        <svg viewBox="0 0 24 24"><path d="M15 4 7 12l8 8" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="nav-title">设置</div>
      <div class="nav-right"></div>
    </header>
    <main class="settings-body">
      <div class="settings-group">
        <div class="settings-label">外观模式</div>
        <button class="setting-row" data-theme-mode="day">
          <span class="set-radio"></span>
          <span class="set-text">
            <b>日间模式</b>
            <small>明亮界面，适合白天使用</small>
          </span>
        </button>
        <button class="setting-row" data-theme-mode="night">
          <span class="set-radio"></span>
          <span class="set-text">
            <b>夜间模式</b>
            <small>深色界面，夜间做题更护眼</small>
          </span>
        </button>
      </div>

      <div class="settings-group">
        <div class="settings-label">确认答案方式</div>
        <button class="setting-row" data-confirm="button">
          <span class="set-radio"></span>
          <span class="set-text">
            <b>按“确认答案”确认</b>
            <small>选好选项后，点击底部“确认答案”提交</small>
          </span>
        </button>
        <button class="setting-row" data-confirm="tap">
          <span class="set-radio"></span>
          <span class="set-text">
            <b>选择选项即确认</b>
            <small>点击选项后立即判定（多选题仍需按“确认答案”）</small>
          </span>
        </button>
      </div>

      <div class="settings-group">
        <div class="settings-label">自动切换下一题</div>
        <button class="setting-row" data-auto-next="off">
          <span class="set-radio"></span>
          <span class="set-text">
            <b>关</b>
            <small>答对后停留在当前题目</small>
          </span>
        </button>
        <button class="setting-row" data-auto-next="right">
          <span class="set-radio"></span>
          <span class="set-text">
            <b>答对自动切换</b>
            <small>答对后自动进入下一题，答错不切换</small>
          </span>
        </button>
      </div>

      <div class="settings-group">
        <div class="settings-label">删除确认</div>
        <button class="setting-row switch-row" data-del-confirm-toggle>
          <span class="set-text">
            <b>删除前二次确认</b>
            <small>关闭后删除练习记录将不再弹出确认框</small>
          </span>
          <span class="switch" id="deleteConfirmSwitch"></span>
        </button>
      </div>

      <div class="settings-group">
        <div class="settings-label">搜索结果</div>
        <button class="setting-row" data-search-limit="all">
          <span class="set-radio"></span>
          <span class="set-text"><b>全部</b><small>一次加载全部搜索结果</small></span>
        </button>
        <button class="setting-row" data-search-limit="50">
          <span class="set-radio"></span>
          <span class="set-text"><b>50 条</b><small>每次加载 50 条结果</small></span>
        </button>
        <button class="setting-row" data-search-limit="100">
          <span class="set-radio"></span>
          <span class="set-text"><b>100 条</b><small>每次加载 100 条结果</small></span>
        </button>
        <button class="setting-row" data-search-limit="200">
          <span class="set-radio"></span>
          <span class="set-text"><b>200 条</b><small>每次加载 200 条结果</small></span>
        </button>
        <div class="setting-row custom-row" data-search-limit="custom">
          <span class="set-radio"></span>
          <span class="set-text"><b>自定义</b><small>输入每次加载的条数（1-9999）</small></span>
          <input id="searchCustomLimit" class="setting-input" type="number" inputmode="numeric" min="1" max="9999" value="50" aria-label="自定义加载条数">
        </div>
        <button class="setting-row switch-row" data-load-rest-toggle>
          <span class="set-text">
            <b>显示“加载剩余结果”</b>
            <small>在搜索结果中提供一次性加载全部剩余结果的按钮</small>
          </span>
          <span class="switch" id="loadRestSwitch"></span>
        </button>
      </div>

      <div class="settings-group">
        <div class="settings-label">科目一 · 重置</div>
        <button class="setting-row reset-row" data-reset="wrong" data-exam="1">
          <span class="set-text"><b>重置错题练习</b><small>清空科目一的错题记录</small></span>
          <span class="reset-tag">重置</span>
        </button>
        <button class="setting-row reset-row" data-reset="collect" data-exam="1">
          <span class="set-text"><b>重置收藏练习</b><small>清空科目一的收藏记录</small></span>
          <span class="reset-tag">重置</span>
        </button>
        <button class="setting-row reset-row" data-reset="progress" data-exam="1">
          <span class="set-text"><b>重置做题进度</b><small>清空科目一的答题记录与正确率</small></span>
          <span class="reset-tag">重置</span>
        </button>
      </div>

      <div class="settings-group">
        <div class="settings-label">科目四 · 重置</div>
        <button class="setting-row reset-row" data-reset="wrong" data-exam="4">
          <span class="set-text"><b>重置错题练习</b><small>清空科目四的错题记录</small></span>
          <span class="reset-tag">重置</span>
        </button>
        <button class="setting-row reset-row" data-reset="collect" data-exam="4">
          <span class="set-text"><b>重置收藏练习</b><small>清空科目四的收藏记录</small></span>
          <span class="reset-tag">重置</span>
        </button>
        <button class="setting-row reset-row" data-reset="progress" data-exam="4">
          <span class="set-text"><b>重置做题进度</b><small>清空科目四的答题记录与正确率</small></span>
          <span class="reset-tag">重置</span>
        </button>
      </div>

      <div class="settings-tip">设置会保存在本机，随时可修改。</div>
    </main>
  </section>

  <!-- 练习页 -->
  <section id="practice" class="screen practice" hidden>
    <header class="nav">
      <button class="nav-back" data-action="exitPractice" aria-label="返回">
        <svg viewBox="0 0 24 24"><path d="M15 4 7 12l8 8" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="nav-title" id="practiceTitle">顺序练习</div>
      <div class="nav-actions">
        <button class="theme-btn" id="themeBtn" data-action="toggleTheme" aria-label="切换夜间模式"></button>
        <button class="recite-btn" id="reciteBtn" data-action="toggleRecite">背题</button>
        <button class="card-btn" data-action="answerCard">
          <svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="7" rx="1.6" stroke="currentColor" stroke-width="1.8" fill="none"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.6" stroke="currentColor" stroke-width="1.8" fill="none"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.6" stroke="currentColor" stroke-width="1.8" fill="none"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.6" stroke="currentColor" stroke-width="1.8" fill="none"/></svg>
          <span>答题卡</span>
        </button>
      </div>
    </header>

    <div class="progress-wrap">
      <div class="progress-meta">
        <span id="progressText">第 1 / 1 题</span>
        <span class="chapter-chip" id="chapterChip" hidden></span>
      </div>
      <div class="progress-bar"><i id="progressFill"></i></div>
    </div>

    <main class="question-scroll" id="questionScroll">
      <div class="qtype-row">
        <img id="qtypeImg" class="qtype-img" alt="题型" src="icons/ic_quez_type_single.png">
        <span class="qtype-hint" id="qtypeHint"></span>
      </div>
      <h1 class="qtitle" id="qtitle"></h1>
      <div class="qimgs" id="qimgs"></div>
      <div class="options" id="options"></div>
      <section class="analysis" id="analysis" hidden></section>
      <div class="scroll-pad"></div>
    </main>

    <footer class="bottom-bar">
      <button class="bar-icon-btn" id="collectBtn" data-action="collect">
        <img id="collectImg" src="icons/ic_quiz_collect1.png" alt="收藏">
        <span id="collectText">收藏</span>
      </button>
      <button class="bar-btn ghost" data-action="prev">上一题</button>
      <button class="bar-btn ghost" id="nextBtn" data-action="nextBtn">下一题</button>
      <button class="bar-btn primary" id="mainBtn" data-action="main">确认答案</button>
    </footer>
  </section>

  <!-- 答题卡 -->
  <div class="sheet-mask" id="cardMask" hidden>
    <div class="sheet" id="cardSheet">
      <div class="sheet-head">
        <div class="sheet-title">答题卡</div>
        <button class="sheet-close" data-action="closeCard" aria-label="关闭">✕</button>
      </div>
      <div class="sheet-legend">
        <span><i class="dot dot-right"></i>答对</span>
        <span><i class="dot dot-wrong"></i>答错</span>
        <span><i class="dot dot-current"></i>当前</span>
        <span><i class="dot dot-none"></i>未答</span>
      </div>
      <div class="sheet-body"><div class="card-grid" id="cardGrid"></div></div>
    </div>
  </div>

  <!-- 图片放大 -->
  <div class="lightbox" id="lightbox" hidden><img id="lightboxImg" alt="题目图片"></div>

  <!-- 确认弹窗 -->
  <div class="confirm-mask" id="confirmMask" hidden>
    <div class="confirm-box">
      <div class="confirm-title" id="confirmTitle">请确认</div>
      <div class="confirm-text" id="confirmText"></div>
      <div class="confirm-actions">
        <button class="confirm-btn" data-action="confirmCancel">取消</button>
        <button class="confirm-btn danger" data-action="confirmOk">确认</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script src="data.js"></script>
<script src="opt/manifest.js"></script>
<script src="app.js"></script>
</body>
</html>
